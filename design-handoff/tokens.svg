    <text x="48" y="184" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="11" fill="#09090B">surface/hero</text>
    <text x="48" y="200" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" font-size="10" fill="#6B6B74">every coin, fixed in code</text>
  </g>
