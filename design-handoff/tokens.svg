<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200">
<rect width="1240" height="1200" fill="#FFFFFF"/>
<text x="48" y="52" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#09090B">BitFinite Wallet — design tokens</text>
<text x="48" y="56" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#09090B">Colour</text>
<text x="48" y="78" font-family="IBM Plex Sans, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6B6B74">Layer names match the token paths. Select a swatch to make a style from it.</text>
<g id="surface/hero">
